name: Note sync validation

on:
  push:
    paths: ["note_sync.py", "test_note_sync.py", ".github/workflows/note-sync*.yml"]
  pull_request:
    paths: ["note_sync.py", "test_note_sync.py", ".github/workflows/note-sync*.yml"]

permissions:
  contents: read

concurrency:
  group: note-notion-sync
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile note_sync.py test_note_sync.py
      - name: Unit tests
        run: python -m unittest test_note_sync -v
      - name: Real RSS smoke test (no Notion credentials)
        run: python note_sync.py --rss-only
      - name: Notion integration verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/note-notion-migration'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_HIKES_DATA_SOURCE_ID: ${{ secrets.NOTION_HIKES_DATA_SOURCE_ID }}
          NOTION_SYNC_LOG_PAGE_ID: ${{ secrets.NOTION_SYNC_LOG_PAGE_ID }}
        run: |
          python note_sync.py
          python note_sync.py --apply
          python note_sync.py --apply
